<div class="details-container">
  <!-- IMAGE -->
  <div class="image-box">
    <img [src]="location?.photo" />
  </div>

  <!-- CONTENT -->
  <div class="content-box">
    <h2>{{ location?.name }}</h2>
    <p>{{ location?.city }}, {{ location?.state }}</p>

    <div class="info">
      <p>Units available: {{ location?.availableUnits }}</p>
      <p>Wifi: {{ location?.wifi }}</p>
      <p>Laundry: {{ location?.laundry }}</p>
    </div>
  </div>

  <!-- NAVIGATION -->
  <div class="nav-buttons">
    <button class="prevNextBtn" (click)="handlePrev()" [disabled]="locationIndex <= 0">
      Prev Page
    </button>

    <button id="editBtn" (click)="handleEdit()">Edit</button>

    <button
      class="prevNextBtn"
      (click)="handleNext()"
      [disabled]="locationIndex >= allLocationsList.length - 1"
    >
      Next Page
    </button>
  </div>
</div>

<div class="overlay" (click)="handleOverlayClick()">
  <div
    class="panel"
    [class.show-panel]="shouldShowPanel()"
    cdkTrapFocus
    cdkTrapFocusAutoCapture
    (click)="$event.stopPropagation()"
  >
    <button class="close-btn" (click)="close()">×</button>

    <h3>Enter the Home details:</h3>

    <form class="form-panel" [formGroup]="profileForm" (ngSubmit)="onSubmit()">
      <label for="id">Id:</label>
      <input id="id" type="number" formControlName="id" />

      <label for="name">Name:</label>
      <input id="name" type="text" formControlName="name" />

      <label for="city">City:</label>
      <input id="city" type="text" formControlName="city" />

      <label for="state">State:</label>
      <input id="state" type="text" formControlName="state" />

      <label for="photo">Photo:</label>
      <input id="photo" type="text" formControlName="photo" placeholder="Enter the url" />

      <label for="availableUnits">Available Units:</label>
      <input id="availableUnits" type="number" formControlName="availableUnits" />

      <div>
        <label for="wifi">Wifi:</label>
        <input id="wifi" type="checkbox" formControlName="wifi" />
      </div>

      <div>
        <label for="laundry">Laundry:</label>
        <input id="laundry" type="checkbox" formControlName="laundry" />
      </div>

      <button type="submit" [disabled]="profileForm.invalid || !profileForm.dirty">Submit</button>

      <!-- Debug info -->
      <p>Invalid: {{ profileForm.invalid }}</p>
      <p>Dirty: {{ profileForm.dirty }}</p>
    </form>
  </div>
</div>
